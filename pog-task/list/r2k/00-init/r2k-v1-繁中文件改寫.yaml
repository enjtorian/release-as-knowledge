  在不同層提供對應的工具與 valid 機制；針對 diff 設計 Mode A（pre-computed） / Mode B（on-demand）的 AB plan。

  本任務輸出：
  - 改寫 README.zh-tw.md
  - 改寫 docs/zh-tw/index.md, faq.md, glossary.md, quickstart.md
  - 將 Manifesto 重新撰寫並放置於 docs/ 下（含中英版位置設計）
  - 修改 AUTHORS.zh-tw.md
  - 更新 mkdocs.yml 導覽
  - 以繁體中文版為主
