description: |
  以 R2K v1 為基準（v1/v2 皆視為 draft，當前重整為 v1）改寫專案繁體中文文件。
  將 R2K 從「以 binary 為主的 release 模式」重新定位為「四階段推薦進程」：
    1. Docker LABEL（L1 Identity / 5 行起步）
